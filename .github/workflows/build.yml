name: Build AI SMS Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI-SMS-Assistant/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: AI-SMS-Assistant
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SMS-Assistant-APK
          path: AI-SMS-Assistant/app/build/outputs/apk/debug/*.apk
